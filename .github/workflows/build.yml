name: Java build and database tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: smartpm_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -ptest"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build WAR and run H2, HTTP and MySQL tests
        run: mvn -B -ntp verify
        env:
          MYSQL_TEST_URL: 'jdbc:mysql://127.0.0.1:3306/smartpm_ci?allowPublicKeyRetrieval=true&useSSL=false'
          MYSQL_TEST_USER: root
          MYSQL_TEST_PASSWORD: test
      - uses: actions/upload-artifact@v4
        with:
          name: smart-project-manager
          path: target/smart-project-manager.war
